
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container py-5">
        <div class="app mx-auto">
            <span class="brand">NOTES / 01</span>
            <h1>Your notes.</h1>
            <p class="subtitle">A simple place to think.</p>

            <textarea id="note" class="form-control mb-3" rows="4"
                placeholder="Write something..."></textarea>

            <button onclick="saveNote()" id="save" class="btn save-btn w-100">
                + Save note
            </button>

            <h5>Your Notes</h5>
            <div id="notes"></div>

            <footer>hello</footer>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
